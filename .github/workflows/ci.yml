name: CI

# ADR-010: org policy is own-runners. No job here may run on GitHub-hosted
# compute. The expression mirrors yantra4d's deploy.yml so a bootstrap or a
# pool migration can be steered from a repository variable without editing
# every job, and falls back to the standing pool when the variable is unset.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full render sweep, 09:00Z (03:00 CDMX).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      report_fixture:
        description: >-
          Exercise the tracking-issue reporter against a committed fixture log
          instead of rendering (e.g. .github/fixtures/nightly-fail-sample.txt).
          Leave blank for a real sweep.
        required: false
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The verification bar is the hyperobjects-spec package, never platform code
  # (RFC 0038 §9, the keystone rule). Pinned by sha: a commons that floats its
  # validator cannot say what bar a green run cleared.
  SPEC_PIN: db65cf1e7a2732d7263efd6eb6ba533640eb536f
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  # Every cartridge, every PR. Manifest conformance is pure python and runs in
  # seconds, so it is never scoped to changed files: a shared-schema change or a
  # bad merge has to be caught across all 500, not just the one in the diff.
  manifests:
    name: manifest conformance (all cartridges)
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the spec (manifest bar only — no CAD kernel)
        env:
          SPEC_READ_TOKEN: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # hyperobjects-spec is private today: use the read token when the secret is set,
          # fall back to the public URL, and fail LOUD naming the operator step otherwise.
          if [ -n "${SPEC_READ_TOKEN}" ]; then
            SPEC_URL="git+https://x-access-token:${SPEC_READ_TOKEN}@github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          else
            SPEC_URL="git+https://github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          fi
          if ! .venv/bin/pip install "hyperobjects-spec @ ${SPEC_URL}"; then
            echo "::error title=keystone not installable::hyperobjects-spec could not be cloned at ${SPEC_PIN} — the repo is private and no read token reached this job. Operator step: make madfam-org/hyperobjects-spec public (RFC 0038 §9 keystone posture) or set the repository secret MADFAM_BOT_PAT with read access to it."
            exit 1
          fi

      - name: y4d-spec check (every cartridge)
        # NOT `./*/`: that glob also picks up libs/ (a submodule mount point with
        # no project.json), which y4d-spec correctly fails as "not a cartridge".
        # Pass only the directories that carry a manifest.
        run: |
          dirs=$(for d in */; do [ -f "$d/project.json" ] && printf './%s ' "$d"; done)
          echo "cartridges: $(echo $dirs | wc -w)"
          .venv/bin/y4d-spec check $dirs -v

  # Geometry is expensive, so on a pull request it runs only for the cartridges
  # the PR actually touched. The nightly sweep is what covers the rest.
  #
  # Two jobs: `render-scope` decides WHICH cartridges (fork-point diff, metadata-
  # only manifests dropped) and cuts them into groups of at most eight;
  # `render-changed` fans out one job per group. The pool's runners are capped at
  # 6 GiB and 1.5 CPU, and a single job rendering 51 cartridges lost its runner
  # twice at the ~30-minute mark with no log to name the culprit — small groups
  # keep every job short, let the unaffected groups pass, and leave the failing
  # group's log behind.
  render-scope:
    name: render scope (which cartridges changed)
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 10
    outputs:
      chunks: ${{ steps.changed.outputs.chunks }}
      none: ${{ steps.changed.outputs.none }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which cartridges changed
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git cat-file -e "$base^{commit}" || { echo "::error title=base unreachable::PR base $base is not in this checkout (fetch-depth); the render lane cannot diff"; exit 1; }
          # Diff from the fork point, not the base branch tip: a PR opened before
          # main moved must not re-render the cartridges main changed meanwhile.
          base=$(git merge-base "$base" "$head")
          # Top-level directory of every changed path that is a cartridge.
          slugs=$(git diff --name-only "$base" "$head" \
            | awk -F/ 'NF>1 {print $1}' \
            | sort -u \
            | while read -r d; do if [ -f "$d/project.json" ]; then echo "$d"; fi; done) || true
          # Manifest-metadata-only changes (attribution, prose, tags, lineage) have
          # no geometry to re-render. render_scope.py drops those, keeps every
          # other kind of change — parameters, parts, presets, engine,
          # verification, any non-manifest file — and cuts the rest into groups.
          chunks=$(python3 .github/scripts/render_scope.py --chunks 8 "$base" "$head" $slugs)
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          if [ "$chunks" = "[]" ]; then
            echo "none=true" >> "$GITHUB_OUTPUT"
            echo "No cartridge changed; the render lane has nothing to do."
          else
            echo "render groups: $chunks"
          fi

  render-changed:
    name: render (cartridges changed in this PR)
    needs: render-scope
    if: github.event_name == 'pull_request' && needs.render-scope.outputs.none != 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Two groups at a time: the pool is shared with the platforms' matrices.
      max-parallel: 2
      matrix:
        group: ${{ fromJson(needs.render-scope.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: System libraries for the CAD kernel (libGL + libXrender for OCP, fonts for text)
        # OCP's C extension links against X and GL at import. libgl1 alone is
        # not enough: nothing in its dependency tree pulls libXrender.so.1,
        # which VTK's renderer asks for. fonts-liberation + fontconfig mirror the
        # platform image (apps/api/Dockerfile): without ANY font, Workplane.text
        # raises ("Font_FontMgr: unable to find any font"), every cartridge that
        # debosses a label degrades to its plain fallback body, and the render
        # lane either fails the mode as "renders the fallback body" or — worse —
        # passes geometry with the text silently missing. Never fails the job on
        # its own — the install step below is where a missing library becomes
        # visible.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
            timeout 300 $SUDO apt-get update -qq $APT_OPTS && \
            $SUDO apt-get install -y --no-install-recommends $APT_OPTS \
              libgl1 libglib2.0-0 libxrender1 fonts-liberation fontconfig \
              || echo "::warning::could not install the CAD kernel's system libraries"
          else
            echo "::warning::apt-get unavailable on this runner"
          fi

      - name: Install the spec (with geometry)
        env:
          SPEC_READ_TOKEN: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # hyperobjects-spec is private today: use the read token when the secret is set,
          # fall back to the public URL, and fail LOUD naming the operator step otherwise.
          if [ -n "${SPEC_READ_TOKEN}" ]; then
            SPEC_URL="git+https://x-access-token:${SPEC_READ_TOKEN}@github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          else
            SPEC_URL="git+https://github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          fi
          if ! .venv/bin/pip install "hyperobjects-spec[geometry] @ ${SPEC_URL}"; then
            echo "::error title=keystone not installable::hyperobjects-spec could not be cloned at ${SPEC_PIN} — the repo is private and no read token reached this job. Operator step: make madfam-org/hyperobjects-spec public (RFC 0038 §9 keystone posture) or set the repository secret MADFAM_BOT_PAT with read access to it."
            exit 1
          fi
          .venv/bin/python -c "import cadquery" || {
            echo "::error::the CAD kernel could not be imported — --render would silently refuse"; exit 1; }

      - name: y4d-spec check --render
        env:
          # OpenSCAD cartridges resolve their includes from the pinned libs/ tree
          # and from this repo's own first-party commons-lib/ (ruling G11).
          # --require-openscad (spec 9c2b341f): the runner image ships OpenSCAD
          # 2026.02.01 (enclii #513/#514), so a missing binary is a failure, never
          # a skip — OpenSCAD cartridges are now verified here, not only locally.
          OPENSCADPATH: ${{ github.workspace }}/libs:${{ github.workspace }}
        run: |
          rc=0
          for slug in ${{ matrix.group }}; do
            echo "::group::render $slug ($(date -u +%H:%M:%SZ))"
            .venv/bin/y4d-spec check "./$slug" --render --require-openscad \
              --openscad-path "$GITHUB_WORKSPACE/libs" --openscad-path "$GITHUB_WORKSPACE" -v || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # The whole commons, geometry included. Nightly rather than per-PR: 500
  # cartridges rendered at defaults AND at every preset is hours of kernel time,
  # which would make the pool unusable for everything else.
  # A red nightly must reach a human. The 2026-08-26 availability audit found
  # that no alert from this estate had ever done so: the sweep failed into a run
  # log nobody opened. The `report` steps below turn a red sweep into ONE
  # tracking issue in this repository — kept current rather than re-opened every
  # night — and the green path closes it again. See .github/scripts/nightly_report.py.
  render-nightly:
    name: nightly full render sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 720
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Dispatch-only escape hatch: feed the reporter a committed fixture log so
      # the issue open/update/close path can be exercised without spending hours
      # of kernel time — and without inventing a fake failure in a real
      # cartridge. Every heavy step below is skipped on a fixture run.
      - name: Reporter dry run (fixture, no rendering)
        id: fixture
        if: inputs.report_fixture != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_FALLBACK: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          fixture="${{ inputs.report_fixture }}"
          test -f "$fixture" || { echo "::error::fixture $fixture not found"; exit 1; }
          python3 .github/scripts/nightly_report.py --selftest "$fixture"
          python3 .github/scripts/nightly_report.py \
            --log "$fixture" --workflow "CI · nightly full render sweep (FIXTURE)"

      - name: System libraries for the CAD kernel (libGL + libXrender for OCP, fonts for text)
        if: inputs.report_fixture == ''
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
            timeout 300 $SUDO apt-get update -qq $APT_OPTS && \
            $SUDO apt-get install -y --no-install-recommends $APT_OPTS \
              libgl1 libglib2.0-0 libxrender1 fonts-liberation fontconfig \
              || echo "::warning::could not install the CAD kernel's system libraries"
          else
            echo "::warning::apt-get unavailable on this runner"
          fi

      - name: Install the spec (with geometry)
        if: inputs.report_fixture == ''
        env:
          SPEC_READ_TOKEN: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # hyperobjects-spec is private today: use the read token when the secret is set,
          # fall back to the public URL, and fail LOUD naming the operator step otherwise.
          if [ -n "${SPEC_READ_TOKEN}" ]; then
            SPEC_URL="git+https://x-access-token:${SPEC_READ_TOKEN}@github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          else
            SPEC_URL="git+https://github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          fi
          if ! .venv/bin/pip install "hyperobjects-spec[geometry] @ ${SPEC_URL}"; then
            echo "::error title=keystone not installable::hyperobjects-spec could not be cloned at ${SPEC_PIN} — the repo is private and no read token reached this job. Operator step: make madfam-org/hyperobjects-spec public (RFC 0038 §9 keystone posture) or set the repository secret MADFAM_BOT_PAT with read access to it."
            exit 1
          fi
          .venv/bin/python -c "import cadquery" || {
            echo "::error::the CAD kernel could not be imported — --render would silently refuse"; exit 1; }

      - name: y4d-spec check --render (every cartridge)
        id: sweep
        if: inputs.report_fixture == ''
        env:
          OPENSCADPATH: ${{ github.workspace }}/libs:${{ github.workspace }}
        run: |
          dirs=$(for d in */; do [ -f "$d/project.json" ] && printf './%s ' "$d"; done)
          echo "cartridges: $(echo $dirs | wc -w)"
          # tee, not a redirect: the log still streams to the run so a human
          # watching sees progress, AND the reporter below has a file to parse.
          # `status` rather than `set -e`: the summary and the report must run
          # even when — especially when — the sweep failed. The default shell is
          # `bash -e -o pipefail`, so `$?` after the pipe is the SWEEP's code,
          # not tee's — the same idiom yantra4d's spec-nightly already uses.
          status=0
          .venv/bin/y4d-spec check $dirs --render --require-openscad \
            --openscad-path "$GITHUB_WORKSPACE/libs" --openscad-path "$GITHUB_WORKSPACE" -v \
            | tee sweep-report.txt || status=$?
          {
            echo "### y4d-spec nightly render sweep"
            tail -1 sweep-report.txt
            grep "FAIL" sweep-report.txt | head -40 || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # A red sweep opens or updates the ONE tracking issue labelled
      # `nightly-sweep`, with the failing renders as a table and a comment
      # naming what broke and what got fixed since the previous red run.
      - name: Report the red sweep to its tracking issue
        if: failure() && steps.sweep.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_FALLBACK: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          python3 .github/scripts/nightly_report.py \
            --log sweep-report.txt \
            --workflow "CI · nightly full render sweep"

      # …and a green sweep closes it, so the alert clears itself instead of
      # training everyone to ignore a permanently open issue.
      - name: Close the tracking issue when the sweep is green
        # Keyed on the SWEEP's own outcome, not merely on the job being green:
        # a job whose sweep step never ran (a fixture dispatch, or any future
        # skip) must not clear an alert it did not re-verify. "Did not run" and
        # "passed" must never look the same.
        if: success() && steps.sweep.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_FALLBACK: ${{ secrets.MADFAM_BOT_PAT }}
        run: python3 .github/scripts/nightly_report.py --green

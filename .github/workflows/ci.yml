name: CI

# ADR-010: org policy is own-runners. No job here may run on GitHub-hosted
# compute. The expression mirrors yantra4d's deploy.yml so a bootstrap or a
# pool migration can be steered from a repository variable without editing
# every job, and falls back to the standing pool when the variable is unset.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full render sweep, 09:00Z (03:00 CDMX).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      report_fixture:
        description: >-
          Exercise the tracking-issue reporter against a committed fixture log
          instead of rendering (e.g. .github/fixtures/nightly-fail-sample.txt).
          Leave blank for a real sweep.
        required: false
        default: ""
      nightly_limit:
        description: >-
          Proof-run escape hatch: RENDER only the first N cartridges (e.g. 16 →
          the first two groups) while the scope stays the whole commons. The
          run is therefore DELIBERATELY incomplete: the completeness check must
          fail the report job and open the tracking issue with a NEVER RENDERED
          row per missing cartridge — that is what it is for. Leave blank for
          the full 500.
        required: false
        default: ""
      nightly_only:
        description: >-
          Debugging input: restrict the RENDER matrix to these comma- or
          space-separated cartridge slugs (e.g. "fan-duct,fasteners"). Like
          nightly_limit it shortens only the matrix, never the scope artifact,
          so the run is deliberately incomplete and the completeness check must
          fail the report job. It exists because nightly_limit can only take a
          PREFIX of the alphabetical scope: proving the verdict fix needed the
          `fasteners` group, which sits at render index 147 and is unreachable
          from any small limit. Never use it for a real nightly.
        required: false
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The verification bar is the hyperobjects-spec package, never platform code
  # (RFC 0038 §9, the keystone rule). Pinned by sha: a commons that floats its
  # validator cannot say what bar a green run cleared.
  SPEC_PIN: 9c9fb84586f8896ea5811a43a25011230aadfca0
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  # Every cartridge, every PR. Manifest conformance is pure python and runs in
  # seconds, so it is never scoped to changed files: a shared-schema change or a
  # bad merge has to be caught across all 500, not just the one in the diff.
  manifests:
    name: manifest conformance (all cartridges)
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the spec (manifest bar only — no CAD kernel)
        env:
          SPEC_READ_TOKEN: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # hyperobjects-spec is private today: use the read token when the secret is set,
          # fall back to the public URL, and fail LOUD naming the operator step otherwise.
          if [ -n "${SPEC_READ_TOKEN}" ]; then
            SPEC_URL="git+https://x-access-token:${SPEC_READ_TOKEN}@github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          else
            SPEC_URL="git+https://github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          fi
          if ! .venv/bin/pip install "hyperobjects-spec @ ${SPEC_URL}"; then
            echo "::error title=keystone not installable::hyperobjects-spec could not be cloned at ${SPEC_PIN} — the repo is private and no read token reached this job. Operator step: make madfam-org/hyperobjects-spec public (RFC 0038 §9 keystone posture) or set the repository secret MADFAM_BOT_PAT with read access to it."
            exit 1
          fi

      - name: y4d-spec check (every cartridge)
        # NOT `./*/`: that glob also picks up libs/ (a submodule mount point with
        # no project.json), which y4d-spec correctly fails as "not a cartridge".
        # Pass only the directories that carry a manifest.
        run: |
          dirs=$(for d in */; do [ -f "$d/project.json" ] && printf './%s ' "$d"; done)
          echo "cartridges: $(echo $dirs | wc -w)"
          .venv/bin/y4d-spec check $dirs -v

  # Geometry is expensive, so on a pull request it runs only for the cartridges
  # the PR actually touched. The nightly sweep is what covers the rest.
  #
  # Two jobs: `render-scope` decides WHICH cartridges (fork-point diff, metadata-
  # only manifests dropped) and cuts them into groups of at most eight;
  # `render-changed` fans out one job per group. The pool's runners are capped at
  # 6 GiB and 1.5 CPU, and a single job rendering 51 cartridges lost its runner
  # twice at the ~30-minute mark with no log to name the culprit — small groups
  # keep every job short, let the unaffected groups pass, and leave the failing
  # group's log behind.
  render-scope:
    name: render scope (which cartridges changed)
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 10
    outputs:
      chunks: ${{ steps.changed.outputs.chunks }}
      none: ${{ steps.changed.outputs.none }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which cartridges changed
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git cat-file -e "$base^{commit}" || { echo "::error title=base unreachable::PR base $base is not in this checkout (fetch-depth); the render lane cannot diff"; exit 1; }
          # Diff from the fork point, not the base branch tip: a PR opened before
          # main moved must not re-render the cartridges main changed meanwhile.
          base=$(git merge-base "$base" "$head")
          # Top-level directory of every changed path that is a cartridge.
          slugs=$(git diff --name-only "$base" "$head" \
            | awk -F/ 'NF>1 {print $1}' \
            | sort -u \
            | while read -r d; do if [ -f "$d/project.json" ]; then echo "$d"; fi; done) || true
          # Manifest-metadata-only changes (attribution, prose, tags, lineage) have
          # no geometry to re-render. render_scope.py drops those, keeps every
          # other kind of change — parameters, parts, presets, engine,
          # verification, any non-manifest file — and cuts the rest into groups.
          chunks=$(python3 .github/scripts/render_scope.py --chunks 8 "$base" "$head" $slugs)
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          if [ "$chunks" = "[]" ]; then
            echo "none=true" >> "$GITHUB_OUTPUT"
            echo "No cartridge changed; the render lane has nothing to do."
          else
            echo "render groups: $chunks"
          fi

  render-changed:
    name: render (cartridges changed in this PR)
    needs: render-scope
    if: github.event_name == 'pull_request' && needs.render-scope.outputs.none != 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Two groups at a time: the pool is shared with the platforms' matrices.
      max-parallel: 2
      matrix:
        group: ${{ fromJson(needs.render-scope.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: System libraries for the CAD kernel (libGL + libXrender for OCP, fonts for text)
        # OCP's C extension links against X and GL at import. libgl1 alone is
        # not enough: nothing in its dependency tree pulls libXrender.so.1,
        # which VTK's renderer asks for. fonts-liberation + fontconfig mirror the
        # platform image (apps/api/Dockerfile): without ANY font, Workplane.text
        # raises ("Font_FontMgr: unable to find any font"), every cartridge that
        # debosses a label degrades to its plain fallback body, and the render
        # lane either fails the mode as "renders the fallback body" or — worse —
        # passes geometry with the text silently missing. Never fails the job on
        # its own — the install step below is where a missing library becomes
        # visible.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
            timeout 300 $SUDO apt-get update -qq $APT_OPTS && \
            $SUDO apt-get install -y --no-install-recommends $APT_OPTS \
              libgl1 libglib2.0-0 libxrender1 fonts-liberation fontconfig \
              || echo "::warning::could not install the CAD kernel's system libraries"
          else
            echo "::warning::apt-get unavailable on this runner"
          fi

      - name: Install the spec (with geometry)
        env:
          SPEC_READ_TOKEN: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # hyperobjects-spec is private today: use the read token when the secret is set,
          # fall back to the public URL, and fail LOUD naming the operator step otherwise.
          if [ -n "${SPEC_READ_TOKEN}" ]; then
            SPEC_URL="git+https://x-access-token:${SPEC_READ_TOKEN}@github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          else
            SPEC_URL="git+https://github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          fi
          if ! .venv/bin/pip install "hyperobjects-spec[geometry] @ ${SPEC_URL}"; then
            echo "::error title=keystone not installable::hyperobjects-spec could not be cloned at ${SPEC_PIN} — the repo is private and no read token reached this job. Operator step: make madfam-org/hyperobjects-spec public (RFC 0038 §9 keystone posture) or set the repository secret MADFAM_BOT_PAT with read access to it."
            exit 1
          fi
          .venv/bin/python -c "import cadquery" || {
            echo "::error::the CAD kernel could not be imported — --render would silently refuse"; exit 1; }

      - name: y4d-spec check --render
        env:
          # OpenSCAD cartridges resolve their includes from the pinned libs/ tree
          # and from this repo's own first-party commons-lib/ (ruling G11).
          # --require-openscad (spec 9c2b341f): the runner image ships OpenSCAD
          # 2026.02.01 (enclii #513/#514), so a missing binary is a failure, never
          # a skip — OpenSCAD cartridges are now verified here, not only locally.
          OPENSCADPATH: ${{ github.workspace }}/libs:${{ github.workspace }}
        run: |
          rc=0
          for slug in ${{ matrix.group }}; do
            echo "::group::render $slug ($(date -u +%H:%M:%SZ))"
            .venv/bin/y4d-spec check "./$slug" --render --require-openscad --parity \
              --openscad-path "$GITHUB_WORKSPACE/libs" --openscad-path "$GITHUB_WORKSPACE" -v || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # The whole commons, geometry included. Nightly rather than per-PR: 500
  # cartridges rendered at defaults AND at every preset is hours of kernel time,
  # which would make the pool unusable for everything else.
  #
  # WHY THIS IS A MATRIX AND NOT ONE JOB (2026-09-06)
  # ------------------------------------------------
  # It used to be one job with `timeout-minutes: 720`. Run 33998128926 ran
  # 2 h 09 m and produced render rows for 454 of the 500 cartridges: the
  # alphabetical tail — `tri-glide-slider` … `zipper-pull-assist` — plus a few
  # others were never reached. The job did not time out and did not error on
  # them; it simply ran out of wall clock while the runner was reclaimed, and
  # NOTHING in the run said 46 cartridges had gone unchecked. A fail-closed bar
  # with a silent 9 % hole in it is worse than no bar, because everyone
  # believes it.
  #
  # Three jobs now, mirroring the per-PR lane that already works:
  #   nightly-scope   — lists every cartridge on the ref and cuts a
  #                     deterministic matrix (nightly_scope.py).
  #   render-nightly  — one job per group; each keeps its OWN verdict and
  #                     uploads its own `sweep-<group>.txt`, so a lost runner
  #                     costs one group, not the night.
  #   nightly-report  — always runs; concatenates every group's log, checks
  #                     COMPLETENESS against the scope, and reports.
  #
  # The completeness check is the point of the restructure: green now means
  # "every group job succeeded AND the union of rendered cartridges equals the
  # scope". An incomplete sweep opens the tracking issue with a
  # "NEVER RENDERED" row per missing cartridge and fails the report job.
  nightly-scope:
    name: nightly scope (cut the commons into render groups)
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && inputs.report_fixture == ''
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 10
    outputs:
      groups: ${{ steps.scope.outputs.groups }}
      count: ${{ steps.scope.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Cut the commons into groups
        id: scope
        run: |
          groups=$(python3 .github/scripts/nightly_scope.py \
            --chunks 8 --limit "${LIMIT:-0}" --only "${ONLY:-}" \
            --slug-list nightly-scope.txt)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < nightly-scope.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "groups: $groups"
        env:
          # Proof-run escape hatch only. It shortens the MATRIX, never the
          # scope artifact, so the run under-covers the bar on purpose: the
          # completeness check below then fails the report job and opens the
          # issue, which is exactly what a proof run has to show. Shortening
          # the scope too would make the check compare N against N and pass —
          # the same false green this restructure exists to abolish.
          LIMIT: ${{ inputs.nightly_limit }}
          # Same asymmetry as LIMIT: matrix only, scope untouched.
          ONLY: ${{ inputs.nightly_only }}

      # The scope is an artifact rather than a job output because the report job
      # has to compare against the exact list the matrix was handed — not
      # re-derive it from a checkout that may have moved.
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-scope
          path: nightly-scope.txt
          retention-days: 7

  render-nightly:
    name: nightly render
    needs: nightly-scope
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && inputs.report_fixture == ''
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    # 90 minutes per group, not 720 for the night. Eight cartridges took 3–5
    # minutes per group on this pool in the per-PR lane (run 34018018690), so 90
    # is ~20x headroom for an ordinary group — generous enough that a timeout
    # means something is genuinely wrong, tight enough that a wedged kernel
    # gives the runner back the same morning instead of holding it for half a
    # day.
    #
    # The one group this is NOT generous for is `zipper`: 39 min 12 s locally
    # for that single cartridge (see nightly_scope.SLOW). If its dedicated group
    # ever hits 90 minutes the timeout is the correct outcome and the report
    # will say so precisely — that group's log is uploaded `if: always()`, its
    # cartridge is absent from the coverage union, and the completeness check
    # names it as NEVER RENDERED instead of letting the night pass. That is the
    # difference from the old single job, which simply stopped 46 cartridges
    # short and said nothing.
    timeout-minutes: 90
    strategy:
      # Never fail-fast: the whole point is that one bad group must not hide
      # the verdict of the other sixty-odd.
      fail-fast: false
      # Three groups at a time. The per-PR lane runs at 2 and the pool visibly
      # honours it (run 34018018690: jobs start in clean pairs, the rest queue),
      # so the pool has at least 2 free slots for this repo in working hours and
      # the nightly runs at 03:00 CDMX when the platforms' matrices are idle.
      # 3 buys ~33 % off the night's wall clock over 2 while still leaving
      # headroom for the manifest job and any human's PR that lands overnight;
      # going higher would let one repo's nightly monopolise a shared pool for
      # hours, which is the failure mode ADR-010 warns about. Revisit if the
      # pool grows.
      max-parallel: 3
      matrix:
        group: ${{ fromJson(needs.nightly-scope.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: System libraries for the CAD kernel (libGL + libXrender for OCP, fonts for text)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
            timeout 300 $SUDO apt-get update -qq $APT_OPTS && \
            $SUDO apt-get install -y --no-install-recommends $APT_OPTS \
              libgl1 libglib2.0-0 libxrender1 fonts-liberation fontconfig \
              || echo "::warning::could not install the CAD kernel's system libraries"
          else
            echo "::warning::apt-get unavailable on this runner"
          fi

      - name: Install the spec (with geometry)
        env:
          SPEC_READ_TOKEN: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # hyperobjects-spec is private today: use the read token when the secret is set,
          # fall back to the public URL, and fail LOUD naming the operator step otherwise.
          if [ -n "${SPEC_READ_TOKEN}" ]; then
            SPEC_URL="git+https://x-access-token:${SPEC_READ_TOKEN}@github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          else
            SPEC_URL="git+https://github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          fi
          if ! .venv/bin/pip install "hyperobjects-spec[geometry] @ ${SPEC_URL}"; then
            echo "::error title=keystone not installable::hyperobjects-spec could not be cloned at ${SPEC_PIN} — the repo is private and no read token reached this job. Operator step: make madfam-org/hyperobjects-spec public (RFC 0038 §9 keystone posture) or set the repository secret MADFAM_BOT_PAT with read access to it."
            exit 1
          fi
          .venv/bin/python -c "import cadquery" || {
            echo "::error::the CAD kernel could not be imported — --render would silently refuse"; exit 1; }

      - name: y4d-spec check --render (this group)
        id: sweep
        env:
          OPENSCADPATH: ${{ github.workspace }}/libs:${{ github.workspace }}
          GROUP: ${{ matrix.group }}
        run: |
          # set -o pipefail — THE fix for the false green of run 34023334942.
          # The step's shell is `/usr/bin/bash -e {0}` (read the run log: the
          # `shell:` line the runner prints). `-e` only; NOT `-o pipefail`, as
          # the comment here used to claim. Without pipefail a pipeline's exit
          # status is its LAST command's, so `y4d-spec … | tee -a` always
          # exited 0 — tee's code — and `|| status=$?` never fired. Group job
          # 101459896772 printed `FAIL fasteners: parity …` twice and
          # `failures=1 … failures=2` for the cartridge, and still concluded
          # SUCCESS. Every one of the 62 FAIL rows that night was swallowed the
          # same way. `-e` is harmless here because the one command that may
          # fail is guarded by the `if` below.
          set -o pipefail
          # A stable, filesystem-safe name for this group's log. The first slug
          # is enough to identify it and keeps the artifact list readable.
          slug_id=$(echo "$GROUP" | awk '{print $1}')
          echo "GROUP_ID=$slug_id" >> "$GITHUB_ENV"
          # The header the report job's parser reads back: it names the group
          # AND the slugs it was handed, so a group whose log never arrives is
          # still visible as a hole in the concatenation.
          echo "=== nightly group $slug_id : $GROUP ===" | tee "sweep-$slug_id.txt"
          # STICKY, and named so it cannot be mistaken for a per-iteration
          # variable: mirrors the per-PR `render-changed` loop (`rc=0` … `||
          # rc=1` … `exit $rc`), which is the loop that DID fail its job on a
          # mid-group failure (PR #38's tripod-hub segfault). A group's verdict
          # is the OR of its cartridges' verdicts; a later green cartridge
          # never clears an earlier red one.
          rc=0
          failed=""
          for slug in $GROUP; do
            echo "::group::render $slug ($(date -u +%H:%M:%SZ))"
            # tee -a: every cartridge's rows land in this group's file, and the
            # log still streams to the run so a human sees progress.
            # `rc` rather than bare `set -e`: the upload and the report must
            # run even when — especially when — a render failed.
            if .venv/bin/y4d-spec check "./$slug" --render --require-openscad --parity \
              --openscad-path "$GITHUB_WORKSPACE/libs" --openscad-path "$GITHUB_WORKSPACE" -v \
              2>&1 | tee -a "sweep-$slug_id.txt"; then
              :
            else
              rc=1
              failed="$failed $slug"
            fi
            echo "::endgroup::"
          done
          # The one line a human reads to know what this group decided. Printed
          # on the green path too: "0 failing" is evidence the verdict was
          # computed, where silence is indistinguishable from a swallowed code.
          n_failed=$(echo $failed | wc -w | tr -d ' ')
          if [ "$rc" -ne 0 ]; then
            echo "GROUP VERDICT: $n_failed failing cartridge(s):$failed"
            echo "::error title=nightly group $slug_id is red::$n_failed failing cartridge(s):$failed"
          else
            echo "GROUP VERDICT: 0 failing cartridge(s)"
          fi
          exit $rc

      # if: always() — a group that failed is exactly the group whose log the
      # report needs. Without this an incomplete or red group would upload
      # nothing and the concatenation would silently lose its rows, which is
      # the very failure this restructure exists to end.
      - name: Upload this group's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ env.GROUP_ID }}
          path: sweep-${{ env.GROUP_ID }}.txt
          retention-days: 7
          if-no-files-found: warn

  # A red nightly must reach a human. The 2026-08-26 availability audit found
  # that no alert from this estate had ever done so: the sweep failed into a run
  # log nobody opened. This job turns a red — or INCOMPLETE — sweep into ONE
  # tracking issue in this repository, kept current rather than re-opened every
  # night, and the green path closes it. See .github/scripts/nightly_report.py.
  nightly-report:
    name: nightly report (aggregate + completeness)
    needs: [render-nightly]
    # always(): a matrix where every group failed still has to be reported, and
    # so does one where a group was cancelled — that is a coverage hole.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      # Dispatch-only escape hatch: feed the reporter a committed fixture log so
      # the issue open/update/close path can be exercised without spending hours
      # of kernel time — and without inventing a fake failure in a real
      # cartridge. The matrix is skipped entirely on a fixture run (the `if:`
      # on nightly-scope and render-nightly), so this job is the whole run.
      - name: Reporter dry run (fixture, no rendering)
        id: fixture
        if: inputs.report_fixture != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_FALLBACK: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          fixture="${{ inputs.report_fixture }}"
          test -f "$fixture" || { echo "::error::fixture $fixture not found"; exit 1; }
          python3 .github/scripts/nightly_report.py --selftest "$fixture"
          python3 .github/scripts/nightly_report.py \
            --log "$fixture" --workflow "CI · nightly full render sweep (FIXTURE)"

      - name: Download every group's log
        if: inputs.report_fixture == ''
        uses: actions/download-artifact@v4
        with:
          path: sweep-artifacts

      - name: Concatenate the groups into one report
        id: aggregate
        if: inputs.report_fixture == ''
        run: |
          # Deterministic order so two reads of the same night agree.
          : > sweep-report.txt
          found=0
          for f in $(find sweep-artifacts -name 'sweep-*.txt' | sort); do
            cat "$f" >> sweep-report.txt
            echo "" >> sweep-report.txt
            found=$((found + 1))
          done
          test -f sweep-artifacts/nightly-scope/nightly-scope.txt \
            && cp sweep-artifacts/nightly-scope/nightly-scope.txt nightly-scope.txt \
            || echo "::warning::the scope artifact is missing — the completeness check cannot run"
          scope=$( [ -f nightly-scope.txt ] && wc -l < nightly-scope.txt | tr -d ' ' || echo 0 )
          # Coverage = the cartridges that produced an `ok` or a `FAIL` row.
          covered=$(grep -cE '^[[:space:]]*(ok|FAIL) ' sweep-report.txt || true)
          fails=$(grep -cE '^[[:space:]]*FAIL ' sweep-report.txt || true)
          echo "group logs: $found | scope: $scope | rows: $covered | FAIL rows: $fails"
          # The rows are EVIDENCE, not decoration. Until 2026-09-06 `fails` was
          # only ever printed and pasted into the step summary, and the verdict
          # below was taken from the matrix result alone — so run 34023334942
          # printed "FAIL rows: 62" on the line above and then called the
          # reporter with --green. Publish it as a step output and let the
          # verdict read it.
          echo "fails=$fails" >> "$GITHUB_OUTPUT"
          {
            echo "### y4d-spec nightly render sweep (chunked)"
            echo ""
            echo "\`groups=$found cartridges=$scope failures=$fails\`"
            echo ""
            grep -E '^[[:space:]]*FAIL ' sweep-report.txt | head -40 || true
          } >> "$GITHUB_STEP_SUMMARY"

      # The verdict, in one place. THREE independent conditions now, all
      # required — the third was added 2026-09-06 after run 34023334942
      # concluded success with 62 FAIL rows in its own concatenated log:
      #   1. every group job succeeded          (needs.render-nightly.result)
      #   2. the union of rendered cartridges == the scope (--require-complete)
      #   3. the concatenated log carries NO FAIL row      (FAILS, below)
      # (3) is belt and braces with the pipefail fix in the group step: the
      # rows are the primary evidence and they now decide, so the report is red
      # even if some future refactor loses a group's exit code again. The three
      # are deliberately independent — a verdict with a single point of failure
      # is what produced the false green.
      #
      # --require-complete and this FAILS branch are the only ways the reporter
      # can fail a job; every other failure path in it exits 0, because an
      # alerting path that turns a green sweep red is worse than the silence it
      # replaces.
      - name: Report — red, incomplete, or green
        if: inputs.report_fixture == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_FALLBACK: ${{ secrets.MADFAM_BOT_PAT }}
          MATRIX_RESULT: ${{ needs.render-nightly.result }}
          FAILS: ${{ steps.aggregate.outputs.fails }}
        run: |
          if [ "$MATRIX_RESULT" = "success" ] && [ "${FAILS:-0}" -eq 0 ]; then
            # Green ONLY if the completeness check also passes: --green with a
            # --scope that is not fully covered flips itself to the red path,
            # opens the issue with a NEVER RENDERED row per missing cartridge,
            # and exits 1 under --require-complete. --green with a log that
            # contains FAIL rows now REFUSES outright (exit 1, ::error) — this
            # branch should never be reached with any, and the reporter says so
            # rather than closing the tracking issue on a red night.
            python3 .github/scripts/nightly_report.py --green \
              --log sweep-report.txt --scope nightly-scope.txt --require-complete \
              --workflow "CI · nightly full render sweep"
          else
            if [ "$MATRIX_RESULT" != "success" ]; then
              echo "::error title=nightly matrix not green::render-nightly finished as '$MATRIX_RESULT'"
            fi
            if [ "${FAILS:-0}" -ne 0 ]; then
              echo "::error title=nightly sweep has failing renders::the concatenated group logs carry $FAILS FAIL row(s); the sweep is red regardless of what the group jobs reported (run 34023334942 reported 62 of them and concluded success)"
            fi
            python3 .github/scripts/nightly_report.py \
              --log sweep-report.txt --scope nightly-scope.txt --require-complete \
              --workflow "CI · nightly full render sweep"
            exit 1
          fi
